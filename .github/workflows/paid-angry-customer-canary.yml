name: Paid angry-customer canary

on:
  pull_request:
    paths:
      - scripts/paid-angry-customer-canary.mjs
      - frontend/src/firebase.js
      - .github/workflows/paid-angry-customer-canary.yml
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base_url:
        description: Studio Agents frontend/API origin
        required: false
        default: https://studioagentsai.com

permissions:
  contents: read
  statuses: write

concurrency:
  group: studio-paid-customer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out canary contract
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate canary syntax and Firebase config discovery
        env:
          STUDIO_FIREBASE_API_KEY: ${{ secrets.STUDIO_FIREBASE_API_KEY }}
        run: |
          node --check scripts/paid-angry-customer-canary.mjs
          node -e "const fs=require('node:fs'); const text=fs.readFileSync('frontend/src/firebase.js','utf8'); const match=text.match(/\\bapiKey\\s*:\\s*[\"']([^\"']+)[\"']/); if (!/^AIza[0-9A-Za-z_-]{30,}$/.test(match?.[1]||'')) process.exit(1);"

  production-paid-customer:
    # Never spend provider credits on an automatic release. A paid-media canary
    # must be started deliberately from workflow_dispatch.
    if: github.event_name == 'workflow_dispatch'
    needs: validate-canary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-canary
    steps:
      - name: Check out exact released canary
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production canary and publish release status
        env:
          STUDIO_CANARY_BASE_URL: ${{ inputs.base_url || 'https://studioagentsai.com' }}
          STUDIO_FIREBASE_API_KEY: ${{ secrets.STUDIO_FIREBASE_API_KEY }}
          STUDIO_CANARY_MEDIA: '1'
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -u
          status_endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          release_status_endpoint="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status"

          publish_status() {
            local state="$1"
            local description="$2"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "${status_endpoint}" \
              --data "{\"state\":\"${state}\",\"context\":\"studio-paid-angry-customer\",\"description\":\"${description}\",\"target_url\":\"${STATUS_TARGET_URL}\"}"
          }

          wait_for_deployment_context() {
            local context="$1"
            local state="pending"

            for _attempt in $(seq 1 60); do
              state="$(
                curl --fail-with-body --silent --show-error \
                  --header "Accept: application/vnd.github+json" \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "${release_status_endpoint}" |
                  jq -r --arg context "${context}" '[.statuses[] | select(.context == $context)][0].state // "pending"'
              )"

              case "${state}" in
                success)
                  echo "Deployment ready: ${context}"
                  return 0
                  ;;
                failure|error)
                  echo "Deployment failed: ${context} (${state})" >&2
                  return 1
                  ;;
                *)
                  echo "Waiting for deployment: ${context} (${state})"
                  sleep 10
                  ;;
              esac
            done

            echo "Timed out waiting for deployment: ${context}" >&2
            return 1
          }

          publish_status pending "Waiting for production deployments"
          if ! wait_for_deployment_context "Vercel – studio-agents" ||
             ! wait_for_deployment_context "studio-agents-backend - studio-agents-backend"; then
            printf '%s\n' '{"ok":false,"error":"Production deployment did not become ready before the paid-customer canary."}' > paid-canary-evidence.json
            cat paid-canary-evidence.json
            publish_status failure "Production deployment was not ready; canary did not run"
            exit 1
          fi

          publish_status pending "Production paid-customer canary is running"
          set +e
          node scripts/paid-angry-customer-canary.mjs > paid-canary-evidence.json 2>&1
          canary_exit=$?
          set -e
          cat paid-canary-evidence.json

          if [ "${canary_exit}" -eq 0 ]; then
            publish_status success "Paid audio/video, credits, history, and deletion passed"
          else
            publish_status failure "Paid-customer canary failed; production remains amber"
          fi

          exit "${canary_exit}"
      - name: Upload paid-customer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-paid-angry-customer-${{ github.sha }}
          path: paid-canary-evidence.json
          if-no-files-found: warn
          retention-days: 7
