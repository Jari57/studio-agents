name: Node CI - Build, Test & Validate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Verify Node.js version
        run: node --version && npm --version

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Verify frontend build output
        run: ls -la frontend/dist/index.html

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Verify backend installation
        run: cd backend && npm list --depth=0

      - name: Block production high/critical dependency vulnerabilities
        run: |
          cd backend && npm audit --omit=dev --audit-level=high
          cd ../frontend && npm audit --omit=dev --audit-level=high

      - name: Verify deployment environment contract
        run: npm run check:env-template

      - name: Check backend syntax
        run: node --check backend/server.js

      - name: Enforce storage privacy contract
        run: npm run privacy:check

      - name: Enforce project access contract
        run: npm run access:check

      - name: Prevent new lint regressions
        run: npm run lint:ci

      - name: Build status
        if: success()
        run: echo "✅ Build successful - ready for Railway deployment"

  # Playwright API & E2E Tests
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Install Playwright browsers
        # The smoke suite covers desktop Chrome, Android Chrome, and Mobile
        # Safari. Install every engine selected in playwright.config.js.
        run: cd frontend && npx playwright install --with-deps chromium webkit

      - name: Run isolated release smoke tests
        # Invoke Playwright from the frontend package. Running it at the repo
        # root can load a second test runner and makes valid specs fail.
        run: cd frontend && npx playwright test tests/release-smoke.spec.ts --reporter=list
        timeout-minutes: 10

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Test status
        if: success()
        run: echo "✅ All tests passed"
